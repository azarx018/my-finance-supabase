<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1a6b3f"/>
      <stop offset="55%" stop-color="#0f4a2c"/>
      <stop offset="100%" stop-color="#062e1c"/>
    </radialGradient>
    <linearGradient id="bill1" x1="30" y1="80" x2="162" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a8d67e"/>
      <stop offset="100%" stop-color="#c8e6a0"/>
    </linearGradient>
    <linearGradient id="bill2" x1="30" y1="70" x2="162" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c3e59a"/>
      <stop offset="100%" stop-color="#e3f3c4"/>
    </linearGradient>
    <linearGradient id="bill3" x1="30" y1="60" x2="162" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eefad0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>

  <!-- Stack of banknotes, centered -->
  <rect x="34" y="92" width="124" height="52" rx="8" fill="url(#bill1)" transform="rotate(-4 96 118)"/>
  <rect x="32" y="78" width="128" height="54" rx="8" fill="url(#bill2)" transform="rotate(-2 96 105)"/>
  <rect x="30" y="63" width="132" height="56" rx="8" fill="url(#bill3)"/>

  <!-- Detail on the top bill -->
  <circle cx="66" cy="91" r="17" fill="rgba(15,74,44,0.12)"/>
  <text x="66" y="97" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#0f4a2c" text-anchor="middle">Rp</text>
  <line x1="98" y1="79" x2="150" y2="79" stroke="rgba(15,74,44,0.2)" stroke-width="3" stroke-linecap="round"/>
  <line x1="98" y1="91" x2="140" y2="91" stroke="rgba(15,74,44,0.2)" stroke-width="3" stroke-linecap="round"/>
  <line x1="98" y1="103" x2="146" y2="103" stroke="rgba(15,74,44,0.2)" stroke-width="3" stroke-linecap="round"/>
</svg>
