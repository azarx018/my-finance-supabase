name: Deploy Cloudflare Worker

# AUTO-DEPLOY DIMATIKAN: push ke main TIDAK lagi men-deploy Worker.
# Deploy manual: GitHub → tab Actions → "Deploy Cloudflare Worker" → Run workflow.
# Untuk menyalakan lagi auto-deploy, tambahkan di bawah `on:`:
#   push:
#     branches: [main]
on:
  workflow_dispatch: {} # hanya jalan kalau dipicu manual dari tab Actions

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker (ai-worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/ai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # wrangler-action both sets the Worker's secret AND deploys, in
      # that order — so GEMINI_API_KEY is always current even if it
      # changes later, without you ever needing `wrangler` locally.
      - name: Set secrets & deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/ai-worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
